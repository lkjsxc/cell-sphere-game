name: verify

on:
  push:
    branches: [main, contest-submission]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structure gate
        run: node scripts/check-structure.mjs
      - name: Canonical identity audit
        run: node scripts/audits/identity-audit.mjs
      - name: Cell-only visual and retired-system audits
        run: node scripts/audits/cell-visual-audit.mjs && node scripts/audits/adaptation-removal-audit.mjs
      - name: Title lifecycle integrity
        run: node scripts/generate-title-showcase.mjs --check
      - name: Unit tests
        run: node --test tests/unit/*.test.js tests/unit/simulation/*.test.js
      - name: Integration tests
        run: node --test tests/integration/*.test.js
      - name: Balance smoke
        run: node scripts/balance.mjs --smoke
      - name: World and no-disaster audits
        run: node scripts/audits/lake-audit.mjs && node scripts/audits/no-disaster-audit.mjs --count=70
      - name: Endless progression audits
        run: node scripts/audits/skill-audit.mjs && node scripts/audits/progression-number-audit.mjs && node scripts/audits/environment-level-audit.mjs --smoke
      - name: Trophy audit
        run: node scripts/audits/trophy-audit.mjs
      - name: Habitat and campaign smoke audits
        run: node scripts/audits/habitat-audit.mjs --count=12 && node scripts/audits/campaign-audit.mjs --smoke
      - name: Local ecology and SCORE smoke audits
        run: node scripts/audits/resource-audit.mjs --count=24 && node scripts/audits/freshwater-audit.mjs --count=24 && node scripts/audits/score-trace-audit.mjs --count=24
      - name: Build transformation, Luminous, and exact REACH 100 audits
        run: node scripts/audits/transformation-audit.mjs --count=12 && node scripts/audits/luminous-audit.mjs && node scripts/audits/reach100-audit.mjs --count=100
      - name: Fair agent tournament smoke
        run: node scripts/agent-tournament.mjs --smoke > /dev/null
      - name: Terminal transaction smoke
        run: node scripts/audits/terminal-soak.mjs --count=100 > /dev/null
      - name: Benchmark
        run: node scripts/benchmark.mjs
      - name: Link / deployment path checks
        run: node scripts/check-links.mjs

  pages:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/contest-submission'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
